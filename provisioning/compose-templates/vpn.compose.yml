# Full TUN mode: all container traffic through Mihomo VPN sidecar
#
# The vpn sidecar holds the network namespace; app uses network_mode: service:vpn.
#
# Kill switch: if vpn sidecar fails or is unhealthy, app loses network access
# immediately because they share the same network namespace.
#
# Requirements:
#   - Place your Mihomo configuration at ./mihomo-vpn.yaml (relative to this file).
#     The config must define a TUN interface and appropriate routing rules.
#   - The host kernel must support TUN (/dev/net/tun).
#
# GPU pass-through: GPU devices are independent of the network namespace and
# can be added directly to the app service (see commented block below).
#
# Port publishing: attach published ports to the vpn service, not to app.
#
# Usage:
#   cp vpn.compose.yml docker-compose.yml
#   # edit mihomo-vpn.yaml with your proxy nodes and rules
#   docker compose up -d
services:
  vpn:
    image: metacubex/mihomo:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./mihomo-vpn.yaml:/root/.config/mihomo/config.yaml:ro
    sysctls:
      - net.ipv4.ip_forward=1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Kill switch: drop all outbound traffic by default so that if mihomo crashes
        # or the tunnel collapses, unencrypted traffic from sidecar apps cannot leak.
        if command -v iptables >/dev/null 2>&1; then
          iptables -P OUTPUT DROP
          iptables -A OUTPUT -o lo -j ACCEPT
          iptables -A OUTPUT -o tun+ -j ACCEPT
          iptables -A OUTPUT -o Meta -j ACCEPT
          iptables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          # Allow DNS resolution via Docker internal resolver (127.0.0.11)
          iptables -A OUTPUT -p udp -d 127.0.0.11 --dport 53 -j ACCEPT
          iptables -A OUTPUT -p tcp -d 127.0.0.11 --dport 53 -j ACCEPT
          # Allow Docker bridge subnets for proxy / gateway reachability
          iptables -A OUTPUT -d 172.16.0.0/12 -j ACCEPT
          iptables -A OUTPUT -d 192.168.0.0/16 -j ACCEPT
          iptables -A OUTPUT -d 10.0.0.0/8 -j ACCEPT
        fi
        exec /mihomo -d /root/.config/mihomo
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090"]
      interval: 30s
      timeout: 10s
      retries: 3

  app:
    image: your-image:latest
    restart: unless-stopped
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy
    # GPU devices can be passed independently of the network namespace:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
