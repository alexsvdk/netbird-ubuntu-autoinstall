# Full TUN mode: all container traffic through Mihomo VPN sidecar
#
# The vpn sidecar holds the network namespace; app uses network_mode: service:vpn.
#
# Kill switch: if vpn sidecar fails or is unhealthy, app loses network access
# immediately because they share the same network namespace.
#
# Requirements:
#   - Place your Mihomo configuration at ./mihomo-vpn.yaml (relative to this file).
#     The config must define a TUN interface and appropriate routing rules.
#   - The host kernel must support TUN (/dev/net/tun).
#
# GPU pass-through: GPU devices are independent of the network namespace and
# can be added directly to the app service (see commented block below).
#
# Port publishing: attach published ports to the vpn service, not to app.
#
# Usage:
#   cp vpn.compose.yml docker-compose.yml
#   # edit mihomo-vpn.yaml with your proxy nodes and rules
#   docker compose up -d
services:
  vpn:
    image: ${MIHOMO_IMAGE:-metacubex/mihomo:v1.19.31@sha256:739edd73a352d6beb82fad6790ef9d417a4d6f061584cc3cab1bd4536d1c60e5}
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./mihomo-vpn.yaml:/root/.config/mihomo/config.yaml:ro
    sysctls:
      - net.ipv4.ip_forward=1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu

        # VPN sidecar requires static inline proxies for fail-closed firewall isolation.
        CONFIG="/root/.config/mihomo/config.yaml"
        if [ -f "$$CONFIG" ]; then
          if grep -q -i -E '("proxy-providers"|'\''proxy-providers'\''|proxy-providers)[[:space:]]*:' "$$CONFIG" 2>/dev/null; then
            echo "Error: proxy-providers are not supported in VPN sidecar TUN mode. Define all endpoints under 'proxies:' in mihomo-vpn.yaml." >&2
            exit 1
          fi
        fi

        # Kill switch: drop all outbound traffic by default so that if mihomo crashes
        # or the tunnel collapses, unencrypted traffic from sidecar apps cannot leak.
        # Fail closed: iptables is mandatory for traffic isolation.
        if ! command -v iptables >/dev/null 2>&1; then
          echo "Error: iptables is required for fail-closed VPN kill switch." >&2
          exit 1
        fi

        # Allow loopback, established connections, and local TUN interfaces (IPv4)
        iptables -A OUTPUT -o lo -j ACCEPT
        iptables -A OUTPUT -o tun+ -j ACCEPT
        iptables -A OUTPUT -o Meta -j ACCEPT
        iptables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT

        # Allow DNS resolution via Docker internal resolver (127.0.0.11)
        iptables -A OUTPUT -p udp -d 127.0.0.11 --dport 53 -j ACCEPT
        iptables -A OUTPUT -p tcp -d 127.0.0.11 --dport 53 -j ACCEPT

        # Allow container default gateway
        GW="$$(ip route show default 2>/dev/null | awk '/default/ {print $$3}' | head -n1)"
        if [ -n "$$GW" ]; then
          iptables -A OUTPUT -d "$$GW" -j ACCEPT
        fi

        # Allow upstream proxy endpoints from Mihomo configuration
        # Handles block YAML (server: ...) and inline YAML ({... server: ...})
        CONFIG="/root/.config/mihomo/config.yaml"
        if [ -f "$$CONFIG" ]; then
          for srv in $$(awk '
          {
            line = $$0
            while (match(line, /server:[[:space:]]*["\047]?([a-zA-Z0-9._-]+)/)) {
              s = substr(line, RSTART, RLENGTH)
              sub(/server:[[:space:]]*["\047]?/, "", s)
              print s
              line = substr(line, RSTART + RLENGTH)
            }
          }' "$$CONFIG" 2>/dev/null); do
            case "$$srv" in
              *[!0-9.]*)
                ips="$$(nslookup "$$srv" 127.0.0.11 2>/dev/null | awk '/^Address:[[:space:]]+[0-9]/ {print $$2}' || true)"
                if [ -z "$$ips" ]; then
                  ips="$$(getent hosts "$$srv" 2>/dev/null | awk '{print $$1}' || true)"
                fi
                for ip in $$ips; do
                  iptables -A OUTPUT -d "$$ip" -j ACCEPT
                done
                ;;
              *)
                iptables -A OUTPUT -d "$$srv" -j ACCEPT
                ;;
            esac
          done
        fi

        # Drop all other outbound IPv4 traffic (kill switch active)
        iptables -P OUTPUT DROP

        # IPv6 kill switch: drop all outbound IPv6 except loopback and tun.
        # Fail closed: ip6tables is mandatory for IPv6 isolation.
        if ! command -v ip6tables >/dev/null 2>&1; then
          echo "Error: ip6tables is required for fail-closed IPv6 kill switch." >&2
          exit 1
        fi
        ip6tables -A OUTPUT -o lo -j ACCEPT
        ip6tables -A OUTPUT -o tun+ -j ACCEPT
        ip6tables -A OUTPUT -o Meta -j ACCEPT
        ip6tables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
        ip6tables -P OUTPUT DROP

        exec /mihomo -d /root/.config/mihomo
    healthcheck:
      test: ["CMD-SHELL", "ip link show tun0 >/dev/null 2>&1 || ip link show Meta >/dev/null 2>&1 || (wget -S --spider -T 2 http://127.0.0.1:9090 2>&1 | grep -q 'HTTP/.*[24]0[0-9]') || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  app:
    image: your-image:latest
    restart: unless-stopped
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy
    # GPU devices can be passed independently of the network namespace:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
