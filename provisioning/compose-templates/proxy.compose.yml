# Proxy mode: HTTP/SOCKS proxy via the host Mihomo Compose service.
# The app joins the external `samovar-mihomo` network and reaches Mihomo as
# `mihomo:7890`. The host service itself publishes 7890 only on 127.0.0.1.
#
# This mode does NOT require NET_ADMIN or TUN.
#
# Usage:
#   cp proxy.compose.yml docker-compose.yml
#   docker compose up -d
services:
  app:
    image: your-image:latest
    restart: unless-stopped
    environment:
      - HTTP_PROXY=http://mihomo:7890
      - HTTPS_PROXY=http://mihomo:7890
      - ALL_PROXY=socks5://mihomo:7890
      - http_proxy=http://mihomo:7890
      - https_proxy=http://mihomo:7890
      - all_proxy=socks5://mihomo:7890
    networks:
      - mihomo

networks:
  mihomo:
    external: true
    name: samovar-mihomo
