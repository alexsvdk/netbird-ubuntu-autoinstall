# Host Mihomo instance managed by systemd and Docker Compose.
# The host exposes only loopback ports. Workload containers can use the
# external `samovar-mihomo` network and reach the service as `mihomo:7890`.
# Update the image with:
#   docker compose --env-file /etc/mihomo/compose.env \
#     -f /etc/mihomo/compose.yml pull mihomo
#   systemctl restart mihomo.service
services:
  mihomo:
    image: ${MIHOMO_IMAGE:-metacubex/mihomo:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:7890:7890"
      - "127.0.0.1:9090:9090"
    entrypoint: ["/mihomo"]
    command: ["-d", "/root/.config/mihomo"]
    volumes:
      - /etc/mihomo:/root/.config/mihomo:ro
      - /var/lib/mihomo:/var/lib/mihomo
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      mihomo:
        aliases:
          - mihomo

networks:
  mihomo:
    name: samovar-mihomo
